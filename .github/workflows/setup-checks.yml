name: Starter setup checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend setup and local Serenity tests
        run: ./mvnw --batch-mode verify
  angular:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: full-stack/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: full-stack/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
